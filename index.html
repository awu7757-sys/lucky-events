<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10091c">
  <meta name="description" content="萬聖狂歡限定・立即體驗｜獨家 VBall 彈珠遊戲開跑">
  <title>萬聖狂歡限定・立即體驗</title>
  <link rel="preload" href="./halloween-poster.png" as="image">
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;overflow:hidden;background:#10091c}
    body{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
    .stage{position:relative;width:min(100vw,calc(100dvh * 941 / 1672));max-height:100dvh;aspect-ratio:941/1672;overflow:hidden;background:#10091c;isolation:isolate}
    .poster{width:100%;height:100%;display:block;object-fit:fill;animation:poster-enter 3.1s cubic-bezier(.16,.75,.25,1) both;transform-origin:center center}
    .stage::before{content:"";position:absolute;z-index:3;inset:0;pointer-events:none;background:#08050e;animation:curtain 2.4s ease-out forwards}
    .stage::after{content:"";position:absolute;z-index:2;inset:-35%;pointer-events:none;background:linear-gradient(112deg,transparent 42%,rgba(255,226,158,.14) 50%,transparent 58%);transform:translateX(-90%);animation:glint 9s 3s ease-in-out infinite}
    .cta{position:absolute;z-index:5;display:block;top:84.4%;height:8.7%;border-radius:18%;text-decoration:none;-webkit-tap-highlight-color:transparent;outline-offset:-3px;opacity:0;animation:cta-enter .7s 2.25s ease-out forwards}
    .cta:focus-visible{outline:3px solid #fff}
    .cta.customer{left:3.0%;width:45.3%}
    .cta.reward{left:50.1%;width:46.8%}
    .cta::after{content:"";position:absolute;inset:6%;border-radius:16px;box-shadow:0 0 0 0 rgba(255,218,100,0);animation:halo 3s 4s ease-in-out infinite;pointer-events:none}
    .cta:active{transform:scale(.97)}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;clip-path:inset(50%)}
    @keyframes curtain{0%,12%{opacity:1}100%{opacity:0}}
    @keyframes poster-enter{0%{opacity:.35;transform:scale(1.055);filter:brightness(.55)}60%{opacity:1;filter:brightness(1.04)}100%{opacity:1;transform:scale(1);filter:brightness(1)}}
    @keyframes cta-enter{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
    @keyframes halo{0%,100%{box-shadow:0 0 0 0 rgba(255,218,100,0)}50%{box-shadow:0 0 18px 2px rgba(255,218,100,.5)}}
    @keyframes glint{0%,68%{transform:translateX(-90%);opacity:0}76%{opacity:1}93%,100%{transform:translateX(90%);opacity:0}}
    @media (prefers-reduced-motion:reduce){.poster,.stage::before,.stage::after,.cta,.cta::after{animation:none!important;opacity:1!important}.stage::before{display:none}}
  </style>
</head>
<body>
  <main class="stage" aria-label="萬聖狂歡限定活動">
    <img class="poster" src="./halloween-poster.png" alt="萬聖狂歡限定，立即體驗。獨家 VBall 彈珠遊戲開跑。支援街口支付、LINE Pay、ATM、USDT。" fetchpriority="high">
    <a class="cta customer" href="https://lin.ee/7UVxhkg" target="_blank" rel="noopener noreferrer" aria-label="加入客服"><span class="sr-only">加入客服</span></a>
    <a class="cta reward" href="https://www.hd5957.com/" target="_blank" rel="noopener noreferrer" aria-label="領取體驗600"><span class="sr-only">領取體驗600</span></a>
  </main>
</body>
</html>
