  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;overflow:hidden;background:#08172c}
    body{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
    .stage{position:relative;width:min(100vw,calc(100dvh * 941 / 1672));max-height:100dvh;aspect-ratio:941/1672;overflow:hidden;background:#08172c;isolation:isolate}
    .poster{width:100%;height:100%;display:block;object-fit:fill;user-select:none;-webkit-user-drag:none}
    .stage::after{content:"";position:absolute;z-index:3;inset:-35%;pointer-events:none;background:linear-gradient(112deg,transparent 43%,rgba(255,240,207,.12) 50%,transparent 57%);transform:translateX(-95%);animation:glint 8s .5s ease-in-out infinite}
    .warm-glow{position:absolute;z-index:2;pointer-events:none;top:-7%;right:-9%;width:58%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,225,156,.18),rgba(255,188,91,.08) 37%,transparent 69%);mix-blend-mode:screen;opacity:.75;animation:glow-breathe 7s ease-in-out infinite}
    .mist{position:absolute;z-index:2;pointer-events:none;left:-40%;width:180%;height:23%;bottom:21%;filter:blur(20px);opacity:0;background:radial-gradient(ellipse at 35% 60%,rgba(145,188,255,.17),transparent 60%),radial-gradient(ellipse at 76% 55%,rgba(255,214,169,.10),transparent 62%);animation:mist-flow 12s ease-in-out infinite}
    .particle-field{position:absolute;inset:0;z-index:3;overflow:hidden;pointer-events:none}
    .spark{position:absolute;bottom:var(--bottom);left:var(--left);width:var(--size);height:var(--size);border-radius:50%;background:radial-gradient(circle,#fff 0%,#e9f7ff 38%,rgba(209,237,255,.1) 70%);box-shadow:0 0 8px 2px rgba(240,248,255,.50);opacity:0;animation:spark-rise var(--duration) var(--delay) linear infinite}
    .title-glow{position:absolute;z-index:3;pointer-events:none;left:13%;top:8%;width:74%;height:15%;border-radius:50%;box-shadow:0 0 45px 10px rgba(255,206,120,.18);opacity:0;animation:title-pulse 6s ease-in-out infinite}
    /* Button hit areas align to the original 941 x 1672 poster; URLs are unchanged. */
    .cta{position:absolute;z-index:6;display:block;top:84.4%;height:8.7%;border-radius:18%;text-decoration:none;-webkit-tap-highlight-color:transparent;outline-offset:-3px}
    .cta:focus-visible{outline:3px solid #fff}
    .cta.customer{left:3.0%;width:45.3%}
    .cta.reward{left:50.1%;width:46.8%}
    .cta::after{content:"";position:absolute;inset:6%;border-radius:16px;box-shadow:0 0 0 0 rgba(255,218,100,0);animation:halo 3s ease-in-out infinite;pointer-events:none}
    .cta:active{transform:scale(.97)}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;clip-path:inset(50%)}
    @keyframes glow-breathe{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}
    @keyframes mist-flow{0%{opacity:0;transform:translateX(-5%)}20%{opacity:.75}50%{transform:translateX(7%);opacity:.6}80%{opacity:.7}100%{opacity:0;transform:translateX(-5%)}}
    @keyframes title-pulse{0%,100%{opacity:.05;transform:scale(.97)}45%{opacity:.6;transform:scale(1.04)}70%{opacity:.12;transform:scale(1)}}
    @keyframes spark-rise{0%,12%{opacity:0;transform:translate3d(0,0,0) scale(.4)}25%{opacity:.95}75%{opacity:.75}100%{opacity:0;transform:translate3d(var(--drift),-32vh,0) scale(.15)}}
    @keyframes halo{0%,100%{box-shadow:0 0 0 0 rgba(255,218,100,0)}50%{box-shadow:0 0 18px 2px rgba(255,218,100,.5)}}
    @keyframes glint{0%,68%{transform:translateX(-95%);opacity:0}76%{opacity:1}93%,100%{transform:translateX(95%);opacity:0}}
    @media (prefers-reduced-motion:reduce){.stage::after,.warm-glow,.mist,.spark,.title-glow,.cta::after{animation:none!important}.stage::after,.warm-glow,.mist,.spark,.title-glow{display:none!important}}

    /* Minimal consent notice: overlays only when a visitor has not decided. */
    .hd68-privacy-tab{position:fixed;z-index:20;right:12px;bottom:calc(8px + env(safe-area-inset-bottom));font:12px system-ui,sans-serif;color:#dceaf7;background:rgba(5,20,38,.85);border:1px solid rgba(234,245,255,.45);border-radius:20px;padding:6px 11px;cursor:pointer;opacity:.84}
    .hd68-privacy-tab:hover,.hd68-privacy-tab:focus-visible{opacity:1}
    .hd68-consent{position:fixed;z-index:25;bottom:calc(13px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(540px,calc(100% - 20px));padding:14px 16px;background:#0b2038f2;border:1px solid #c49a49;border-radius:14px;box-shadow:0 12px 35px #000b;color:#fff;font:13px/1.55 system-ui,-apple-system,'Noto Sans TC',sans-serif}
    .hd68-consent[hidden]{display:none!important}
    .hd68-consent-title{font-weight:750;color:#ffe2a1;font-size:14px;margin:0 0 4px}
    .hd68-consent p{margin:0 0 8px}
    .hd68-consent a{color:#d5eaff;text-decoration:underline}
    .hd68-consent-controls{display:flex;gap:10px;margin-top:10px}
    .hd68-consent-controls button{flex:1;min-height:39px;cursor:pointer;border-radius:9px;border:1px solid #adbed4;padding:8px 10px;font:700 13px system-ui,sans-serif}
    .hd68-consent-reject{background:#253b55;color:#fff}
    .hd68-consent-allow{background:linear-gradient(#ffe7a1,#eab642);color:#192535;border-color:#f8d784!important}
    @media(max-width:420px){.hd68-consent{padding:11px 12px;font-size:12px}.hd68-consent-controls button{font-size:12px}}
  </style>
</head>
